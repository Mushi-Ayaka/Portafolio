<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Space Grotesk', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0b2230"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="64" y="96" fill="#e2f6fb" font-size="34" font-weight="700">Campo Tensorial</text>
  <text x="64" y="128" fill="#7dd3fc" font-size="19" font-weight="500" letter-spacing="3">MLIR · MULTI-NIVEL</text>

  <g font-family="ui-monospace, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <line x1="370" y1="332" x2="406" y2="332" stroke="#67e8f9" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="580" y1="332" x2="616" y2="332" stroke="#67e8f9" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="790" y1="332" x2="826" y2="332" stroke="#67e8f9" stroke-width="3" marker-end="url(#ah)"/>
    <rect x="200" y="300" width="170" height="64" rx="12" fill="#22d3ee"/>
    <rect x="410" y="300" width="170" height="64" rx="12" fill="#06b6d4"/>
    <rect x="620" y="300" width="170" height="64" rx="12" fill="#0e7490"/>
    <rect x="830" y="300" width="170" height="64" rx="12" fill="#155e75"/>
    <g fill="#e2f6fb">
      <text x="285" y="340">GTE</text>
      <text x="495" y="340">PTR</text>
      <text x="705" y="340">CTP</text>
      <text x="915" y="340">TB</text>
    </g>
  </g>

  <text x="64" y="470" fill="#a5f3fc" font-family="ui-monospace, monospace" font-size="32">&#8711;·T = 0    (campo tensorial libre de divergencia)</text>
  <text x="64" y="514" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="24">lowering    GTE &#8594; PTR &#8594; CTP &#8594; TB</text>

  <text x="64" y="624" fill="#cbd5e1" font-size="18">Compresión lossless · 100% C++17 · sin dependencias de runtime</text>
</svg>
